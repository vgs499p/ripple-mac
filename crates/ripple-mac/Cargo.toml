[package]
name = "ripple-mac"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ripple"
path = "src/main.rs"

[dependencies]
ripple-core = { path = "../ripple-core" }
iced = { version = "0.13.1", default-features = false, features = ["image", "svg", "tokio", "lazy"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
tokio = { version = "1", features = ["sync"] }
url = "2"
serde = {version="1",features=["derive"]}
serde_json = "1"

[features]
default = ["gpu"]
gpu = ["iced/wgpu"]
software = ["iced/tiny-skia"]
qa = []

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
objc2 = "0.6.5"
objc2-foundation = { version="0.3.2", default-features=false, features=["std", "NSObject"] }
objc2-app-kit = { version="0.3.2", default-features=false, features=["std", "NSApplication", "NSMenu", "NSMenuItem"] }
rfd = { version = "0.15", default-features = false }

[dev-dependencies]
iced_runtime = "0.13.2"
resvg = "0.42"

