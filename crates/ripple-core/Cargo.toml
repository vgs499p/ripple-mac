[package]
name = "ripple-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "multipart", "stream"] }
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
futures-util = "0.3"
thiserror = "2"

[dev-dependencies]
serde_json = "1"

